<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 唔畀 Google 收錄。知道網址嘅人照樣直接開，唔使打任何嘢。 -->
<meta name="robots" content="noindex, nofollow">
<title>經濟科教材</title>
<meta name="theme-color" content="#15263A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="經濟科教材">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1F4;
  --grid:rgba(21,38,58,.055);
  --card:#FFFFFF;
  --ink:#15263A;
  --ink-soft:#3D4F66;
  --muted:#71829A;
  --line:#DCE3EA;
  --curve:#2F6FA8;      /* 練習：圖表藍線 */
  --marker:#B3271E;     /* 答案：改簿紅筆 */
  --note:#2C7A5B;       /* 筆記：綠 */
  --slate:#67788E;      /* 其他類型 */
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"PingFang HK","PingFang TC","Noto Sans HK","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(to right,var(--grid) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  -webkit-font-smoothing:antialiased;
  padding-bottom:56px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ── 頁頂 ───────────────────────────────── */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(237,241,244,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.masthead{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.glyph{flex:none}
.wordmark{font-size:17px;font-weight:600;letter-spacing:.02em;line-height:1.1}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:3px}

.searchrow{display:flex;gap:8px;padding-bottom:10px}
.search{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:0 10px;height:38px;
}
.search input{
  flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);
  min-width:0;
}
.search input::placeholder{color:var(--muted)}
.clearbtn{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:4px;display:none}
.clearbtn.on{display:block}

.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;flex:none}
.seg button{
  font-family:var(--sans);font-size:13px;color:var(--muted);
  border:0;background:transparent;padding:0 11px;height:36px;cursor:pointer;white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

.facets{padding-bottom:12px;display:flex;flex-direction:column;gap:7px}
.facet{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.facet::-webkit-scrollbar{display:none}
.facet-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);flex:none;width:34px}
.chip{
  flex:none;font-family:var(--sans);font-size:13px;line-height:1;
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:999px;padding:7px 12px;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.t-answer[aria-pressed="true"]{background:var(--marker);border-color:var(--marker)}
.chip.t-blank[aria-pressed="true"]{background:var(--curve);border-color:var(--curve)}
.chip.t-notes[aria-pressed="true"]{background:var(--note);border-color:var(--note)}

/* ── 公告 ───────────────────────────────── */
.notice{
  display:none;margin:12px 0 0;padding:11px 13px;
  background:#FFF8E1;border:1px solid #EBD9A3;border-left:3px solid #C79A20;
  border-radius:var(--radius);font-size:14px;line-height:1.55;color:#4A3A10;
}
.notice.on{display:block}

/* ── 統計 ───────────────────────────────── */
.count{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);padding:14px 0 8px}

/* ── 章節軸 ─────────────────────────────── */
.group{position:relative;padding-left:52px;margin-bottom:6px}
.group::before{
  content:"";position:absolute;left:22px;top:6px;bottom:0;width:1px;background:var(--line);
}
.group:last-child::before{bottom:14px}
.tick{position:relative;height:26px;display:flex;align-items:center}
.tick::before{
  content:"";position:absolute;left:-30px;top:50%;width:14px;height:1px;background:var(--ink);opacity:.35;
}
.tick span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
.flat .group{padding-left:0}
.flat .group::before,.flat .tick{display:none}

/* ── 卡片 ───────────────────────────────── */
.card{
  display:flex;align-items:stretch;gap:0;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:8px;overflow:hidden;
  transition:transform .12s ease,box-shadow .12s ease;
}
.card:hover{transform:translateY(-1px);box-shadow:0 2px 10px rgba(21,38,58,.07)}
.card:focus-visible{outline:2px solid var(--curve);outline-offset:2px}
.edge{width:3px;flex:none;background:var(--slate)}
.edge.t-answer{background:var(--marker)}
.edge.t-blank{background:var(--curve)}
.edge.t-notes{background:var(--note)}
.body{flex:1;padding:11px 13px;min-width:0}
.title{display:block;font-size:15px;font-weight:500;line-height:1.45;word-break:break-word}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;padding:2px 6px;border-radius:4px;background:#EEF2F6;color:var(--ink-soft)}
.tag.t-answer{background:#FBEBEA;color:var(--marker)}
.tag.t-blank{background:#E9F1F8;color:var(--curve)}
.tag.t-notes{background:#E7F3ED;color:var(--note)}
.when{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.new{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:#fff;background:var(--ink);padding:2px 5px;border-radius:3px}
.arrow{display:flex;align-items:center;padding-right:12px;color:#B9C4D0;flex:none}
.card.read .title{color:var(--ink-soft);font-weight:400}
.card.read .arrow{color:#D3DAE2}
.dot{width:5px;height:5px;border-radius:50%;background:#C3CCD6;flex:none}

/* ── 狀態 ───────────────────────────────── */
.state{padding:48px 4px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.6}
.state strong{display:block;color:var(--ink);font-size:15.5px;font-weight:600;margin-bottom:6px}
.state button{
  margin-top:14px;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);border-radius:var(--radius);padding:8px 16px;cursor:pointer;
}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:56px 0;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.14em}
.loading i{display:block;width:90px;height:2px;background:var(--line);overflow:hidden;border-radius:2px}
.loading i::after{content:"";display:block;width:40%;height:100%;background:var(--curve);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

footer{padding:26px 0 10px;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:#9AA8B8}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="masthead">
      <svg class="glyph" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <path d="M4 3v19h19" fill="none" stroke="#15263A" stroke-width="1.4" stroke-linecap="square"/>
        <path d="M7 7c6 0 9 4 13 12" fill="none" stroke="#2F6FA8" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M7 19c5-9 9-11 13-12" fill="none" stroke="#B3271E" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="wordmark">經濟科教材</div>
        <div class="eyebrow" id="eyebrow">S4 · S5</div>
      </div>
    </div>

    <div class="searchrow">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="#71829A" stroke-width="1.5"/><path d="M11 11l4 4" stroke="#71829A" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="q" type="search" inputmode="search" placeholder="搜尋標題、章節" autocomplete="off" aria-label="搜尋教材">
        <button class="clearbtn" id="clear" aria-label="清除搜尋">×</button>
      </label>
      <div class="seg" role="group" aria-label="排序">
        <button id="sortNew" aria-pressed="true">最新</button>
        <button id="sortCh" aria-pressed="false">章節</button>
      </div>
    </div>

    <div class="facets" id="facets"></div>
  </div>
</header>

<main class="wrap">
  <div class="notice" id="notice"></div>
  <div class="count" id="count" hidden></div>
  <div id="list">
    <div class="loading"><i></i>載入教材目錄</div>
  </div>
  <footer id="foot"></footer>
</main>

<script type="module">
/* ═══════════════════════════════════════════════════════════
   要改嘅嘢全部喺呢個框入面。下面唔使掂。
   ═══════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyB4r7vLxGyM2e_645yyZtO6Fp-2QJEEnt4",
  authDomain: "econ-materials.firebaseapp.com",
  projectId: "econ-materials",
  storageBucket: "econ-materials.firebasestorage.app",
  messagingSenderId: "274972755892",
  appId: "1:274972755892:web:2bb100743ecbdea73e54e1"
};

const COLLECTION = "materials";   // sync.gs 寫入嘅 collection 名
const NEW_DAYS   = 7;             // 幾多日內顯示 NEW
const NOTICE_DOC = ["config", "site"]; // 公告：Firestore 開 config/site，加一個 announcement 欄位就會喺頂部出現

// 類型嘅中文顯示名。sync.gs 出咩字，呢度就對咩字；未見過嘅照原樣顯示。
const TYPE_LABEL = {
  answer:"答案", blank:"練習", notes:"筆記", note:"筆記",
  worksheet:"工作紙", "past paper":"歷屆試題", pastpaper:"歷屆試題", mc:"MC"
};
/* ═══════════════════════════════════════════════════════════ */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = (id) => document.getElementById(id);
const listEl = $("list"), countEl = $("count"), facetsEl = $("facets"),
      noticeEl = $("notice"), qEl = $("q"), clearEl = $("clear"), footEl = $("foot");

/* ── 本機記錄（已開過嘅教材）。無痕模式會擲錯，所以包住。 ── */
const store = (() => {
  const KEY = "econ-read-v1";
  let mem = [];
  try { mem = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { mem = []; }
  const set = new Set(Array.isArray(mem) ? mem : []);
  return {
    has: (id) => set.has(id),
    add: (id) => {
      set.add(id);
      try { localStorage.setItem(KEY, JSON.stringify([...set].slice(-400))); } catch (e) {}
    }
  };
})();

/* ── 欄位讀取：容忍 sync.gs 用唔同名或者將來改名 ── */
const firstOf = (d, names) => {
  for (const n of names) {
    const v = d[n];
    if (v !== undefined && v !== null && v !== "") return v;
  }
  return null;
};

const toDate = (v) => {
  if (!v) return null;
  if (typeof v.toDate === "function") return v.toDate();            // Firestore Timestamp
  if (typeof v === "object" && typeof v.seconds === "number") return new Date(v.seconds * 1000);
  if (typeof v === "number") return new Date(v < 1e12 ? v * 1000 : v);
  if (typeof v === "string") { const t = Date.parse(v); return isNaN(t) ? null : new Date(t); }
  return null;
};

const pickDate = (d) => {
  const known = firstOf(d, ["publishedAt","addedAt","createdAt","updatedAt","syncedAt","publishedDate","date","lastUpdated","modifiedAt"]);
  const dt = toDate(known);
  if (dt) return dt;
  for (const v of Object.values(d)) {          // 搵唔到就掃全部欄位，邊個似日期就用邊個
    if (v && (typeof v.toDate === "function" || (typeof v === "object" && typeof v.seconds === "number"))) {
      const x = toDate(v); if (x) return x;
    }
  }
  return null;
};

const pickUrl = (d) => {
  const u = firstOf(d, ["url","link","webViewLink","driveUrl","viewUrl","fileUrl"]);
  if (typeof u === "string" && u.startsWith("http")) return u;
  const fid = firstOf(d, ["fileId","driveId","id"]);
  if (typeof fid === "string" && fid.length > 20) return `https://drive.google.com/file/d/${fid}/view`;
  for (const v of Object.values(d)) if (typeof v === "string" && v.startsWith("https://drive.google.com")) return v;
  return null;
};

const chapterNum = (c) => {
  if (typeof c === "number") return c;
  const m = String(c ?? "").match(/\d+/);
  return m ? parseInt(m[0], 10) : null;
};

const typeKey   = (t) => String(t ?? "").trim().toLowerCase();
const typeLabel = (t) => TYPE_LABEL[typeKey(t)] || (t || "");
const typeClass = (t) => {
  const k = typeKey(t);
  if (k.startsWith("ans") || k.includes("sol")) return "t-answer";
  if (k.startsWith("blank") || k.includes("練習") || k.includes("worksheet")) return "t-blank";
  if (k.startsWith("note")) return "t-notes";
  return "";
};

const fmtDate = (d) => {
  if (!d) return "";
  const now = new Date();
  const same = d.getFullYear() === now.getFullYear();
  return same ? `${d.getMonth() + 1}月${d.getDate()}日`
              : `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ── 狀態 ── */
let items = [];
let sortMode = "new";                    // new | chapter
const picked = { grade: new Set(), type: new Set() };

/* ── 攞資料 ── */
async function load() {
  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const snap = await getDocs(collection(db, COLLECTION));
  items = snap.docs.map((s) => {
    const d = s.data() || {};
    const active = firstOf(d, ["active"]);
    return {
      id: s.id,
      title: firstOf(d, ["title","name","displayName"]) || "(未命名)",
      grade: String(firstOf(d, ["grade","level","form","class"]) || "").trim(),
      type:  String(firstOf(d, ["type","category","kind"]) || "").trim(),
      chapter: firstOf(d, ["chapter","ch","topic"]),
      url: pickUrl(d),
      when: pickDate(d),
      hidden: active === false || active === "false" || active === 0
    };
  });

  // 冇連結嘅資料唔會出現喺畫面。喺瀏覽器 Console 見到呢句，就係 sync.gs 嗰個欄位名同呢度對唔上。
  items.filter((m) => !m.hidden && !m.url).forEach((m) => console.warn("搵唔到連結，已略過：", m.id, m.title));
  items = items.filter((m) => !m.hidden && m.url);

  // 公告（無呢個 document 就當冇公告，唔會出錯）
  getDoc(doc(db, NOTICE_DOC[0], NOTICE_DOC[1])).then((s) => {
    if (!s.exists()) return;
    const t = firstOf(s.data() || {}, ["announcement","notice","message","公告"]);
    if (typeof t === "string" && t.trim()) {
      noticeEl.textContent = t.trim();
      noticeEl.classList.add("on");
    }
  }).catch(() => {});
}

/* ── 篩選標籤：由資料自己長出嚟，唔使寫死 ── */
function buildFacets() {
  const grades = [...new Set(items.map((m) => m.grade).filter(Boolean))].sort();
  const types  = [...new Set(items.map((m) => m.type).filter(Boolean))]
    .sort((a, b) => typeKey(a).localeCompare(typeKey(b)));

  $("eyebrow").textContent = grades.length ? grades.join(" · ") : "S4 · S5";

  const row = (label, key, values, labelFn) => {
    if (values.length < 2) return "";
    return `<div class="facet"><span class="facet-label">${label}</span>` +
      values.map((v) => `<button class="chip ${key === "type" ? typeClass(v) : ""}" data-facet="${key}" data-value="${esc(v)}" aria-pressed="false">${esc(labelFn(v))}</button>`).join("") +
      `</div>`;
  };

  facetsEl.innerHTML = row("班別", "grade", grades, (v) => v) + row("類型", "type", types, typeLabel);

  facetsEl.querySelectorAll(".chip").forEach((b) => {
    b.addEventListener("click", () => {
      const f = b.dataset.facet, v = b.dataset.value;
      picked[f].has(v) ? picked[f].delete(v) : picked[f].add(v);
      b.setAttribute("aria-pressed", picked[f].has(v) ? "true" : "false");
      render();
    });
  });
}

/* ── 畫面 ── */
function render() {
  const q = qEl.value.trim().toLowerCase();
  clearEl.classList.toggle("on", q.length > 0);

  const shown = items.filter((m) => {
    if (picked.grade.size && !picked.grade.has(m.grade)) return false;
    if (picked.type.size && !picked.type.has(m.type)) return false;
    if (!q) return true;
    const hay = [m.title, m.grade, m.type, typeLabel(m.type), m.chapter,
                 chapterNum(m.chapter) ? "chapter " + chapterNum(m.chapter) : ""]
      .join(" ").toLowerCase();
    return hay.includes(q);
  });

  if (!items.length) {
    listEl.innerHTML = `<div class="state"><strong>目錄仲係空嘅</strong>老師上載教材之後，呢度就會出現。</div>`;
    countEl.hidden = true; return;
  }
  if (!shown.length) {
    listEl.innerHTML = `<div class="state"><strong>搵唔到符合嘅教材</strong>試下清除篩選或者換個字。<br><button id="reset">清除全部篩選</button></div>`;
    countEl.hidden = true;
    $("reset").onclick = () => {
      qEl.value = "";
      picked.grade.clear(); picked.type.clear();
      facetsEl.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", "false"));
      render();
    };
    return;
  }

  countEl.hidden = false;
  countEl.textContent = shown.length === items.length ? `共 ${items.length} 份` : `${shown.length} / ${items.length} 份`;

  const ts = (m) => (m.when ? m.when.getTime() : 0);
  let groups;

  if (sortMode === "chapter") {
    const map = new Map();
    shown.forEach((m) => {
      const n = chapterNum(m.chapter);
      const key = n !== null ? String(n) : (m.chapter ? String(m.chapter) : "__none");
      if (!map.has(key)) map.set(key, { n, raw: m.chapter, list: [] });
      map.get(key).list.push(m);
    });
    groups = [...map.values()].sort((a, b) => {
      if (a.n === null) return 1;
      if (b.n === null) return -1;
      return a.n - b.n;
    }).map((g) => ({
      label: g.n !== null ? `CH ${g.n}` : (g.raw ? String(g.raw) : "未分章節"),
      list: g.list.sort((x, y) => ts(y) - ts(x))
    }));
  } else {
    groups = [{ label: null, list: [...shown].sort((a, b) => ts(b) - ts(a)) }];
  }

  const fresh = Date.now() - NEW_DAYS * 864e5;
  listEl.className = sortMode === "chapter" ? "" : "flat";
  listEl.innerHTML = groups.map((g) => `
    <section class="group">
      ${g.label ? `<div class="tick"><span>${esc(g.label)}</span></div>` : ""}
      ${g.list.map(card).join("")}
    </section>`).join("");

  listEl.querySelectorAll(".card").forEach((a) => {
    a.addEventListener("click", () => { store.add(a.dataset.id); a.classList.add("read"); });
  });

  function card(m) {
    const isNew = m.when && m.when.getTime() > fresh;
    const cls = typeClass(m.type);
    return `<a class="card ${store.has(m.id) ? "read" : ""}" data-id="${esc(m.id)}" href="${esc(m.url)}" target="_blank" rel="noopener">
      <span class="edge ${cls}"></span>
      <span class="body">
        <span class="title">${esc(m.title)}</span>
        <span class="meta">
          ${m.grade ? `<span class="tag">${esc(m.grade)}</span>` : ""}
          ${m.type ? `<span class="tag ${cls}">${esc(typeLabel(m.type))}</span>` : ""}
          ${sortMode !== "chapter" && chapterNum(m.chapter) !== null ? `<span class="tag">CH ${chapterNum(m.chapter)}</span>` : ""}
          ${m.when ? `<span class="when">${fmtDate(m.when)}</span>` : ""}
          ${isNew ? `<span class="new">NEW</span>` : ""}
          ${store.has(m.id) ? `<span class="dot" title="開過"></span>` : ""}
        </span>
      </span>
      <span class="arrow"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>`;
  }
}

/* ── 事件 ── */
qEl.addEventListener("input", render);
clearEl.addEventListener("click", (e) => { e.preventDefault(); qEl.value = ""; qEl.focus(); render(); });
$("sortNew").addEventListener("click", () => setSort("new"));
$("sortCh").addEventListener("click", () => setSort("chapter"));
function setSort(mode) {
  sortMode = mode;
  $("sortNew").setAttribute("aria-pressed", mode === "new" ? "true" : "false");
  $("sortCh").setAttribute("aria-pressed", mode === "chapter" ? "true" : "false");
  render();
}

/* ── 開波 ── */
load().then(() => {
  buildFacets();
  render();
  const latest = items.map((m) => (m.when ? m.when.getTime() : 0)).sort((a, b) => b - a)[0];
  footEl.textContent = latest ? `最後更新 ${fmtDate(new Date(latest))}` : "";
}).catch((err) => {
  console.error(err);
  listEl.innerHTML = `<div class="state"><strong>連接唔到教材目錄</strong>可能係網絡問題。<br><button onclick="location.reload()">重新載入</button></div>`;
});
</script>
</body>
</html>
